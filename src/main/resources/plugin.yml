name: WeaponGems
version: ${version}
main: me.monkeee.weaponGems.WeaponGems
api-version: '1.21'
prefix: WG
authors: [ _Monkeee ]
commands:
  givegem:
    description: Gives the wanted gem to the player
  wgreload:
    description: Reloads the plugin's config
  wgapply:
    description: Applies the item and gem together
  wgcds:
    description: Get's the player's gem cooldowns
  wgremove:
    description: Remove a specific gem from an item
  geminfo:
    description: Gets all of the registered gems in the server
permissions:
  wg.getall:
    description: Grants the ability to use /geminfo
    default: op